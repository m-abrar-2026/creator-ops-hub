services:
  version: '3.8'

  services:
    db:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: root123
        MYSQL_DATABASE: creator_ops
      ports:
        - "3306:3306"
      volumes:
        - mysql_data:/var/lib/mysql

    web:
      build: .
      ports:
        - "5000:5000"
      environment:
        - DATABASE_URL=mysql+pymysql://root:root123@db:3306/creator_ops
        - GROQ_API_KEY=${GROQ_API_KEY}
      depends_on:
        - db

  volumes:
    mysql_data: